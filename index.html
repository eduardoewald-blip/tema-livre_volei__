<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Center - Vôlei Masculino</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="container">
        <!-- Cabeçalho de Navegação Direta -->
        <header class="match-header">
            <div class="logo">MASCULINO // <span>PREMIUM</span></div>
            <div class="filters">
                <button class="filter-btn active" data-filter="todos">Todos</button>
                <button class="filter-btn" data-filter="vivo">Ao Vivo</button>
                <button class="filter-btn" data-filter="proximos">Próximos</button>
            </div>
        </header>

        <!-- Grid Onde Ficam os Blocos de Jogos -->
        <main class="grid-jogos" id="quadra-jogos"></main>
    </div>

    <script src="script.js"></script>
</body>
</html>
